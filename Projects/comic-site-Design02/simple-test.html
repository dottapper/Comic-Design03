<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Test</title>
    <style>
        .simple-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px;
        }
        .simple-item {
            background: white;
            border: 2px solid #000;
            height: 200px;
        }
        .simple-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body style="background: #000;">
    <div class="simple-grid">
        <div class="simple-item">
            <img src="images/main01.png" class="simple-img">
        </div>
        <div class="simple-item">
            <img src="images/main02.png" class="simple-img">
        </div>
        <div class="simple-item">
            <img src="images/main03.png" class="simple-img">
        </div>
    </div>
</body>
</html>
