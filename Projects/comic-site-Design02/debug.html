<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Images</title>
    <style>
        body { margin: 20px; background: #000; }
        .debug-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 800px;
        }
        .debug-item {
            background: white;
            border: 2px solid red;
            min-height: 200px;
            padding: 10px;
        }
        .debug-image {
            width: 100%;
            height: 180px;
            object-fit: contain;
            border: 1px solid blue;
        }
    </style>
</head>
<body>
    <h1 style="color: white;">Image Debug Test</h1>
    <div class="debug-container">
        <div class="debug-item">
            <p style="color: black;">Image 1:</p>
            <img src="images/main01.png" alt="Test 1" class="debug-image">
        </div>
        <div class="debug-item">
            <p style="color: black;">Image 2:</p>
            <img src="images/main02.png" alt="Test 2" class="debug-image">
        </div>
        <div class="debug-item">
            <p style="color: black;">Image 3:</p>
            <img src="images/main03.png" alt="Test 3" class="debug-image">
        </div>
    </div>
</body>
</html>
