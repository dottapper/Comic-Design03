<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLOTTRON - Comic Hub</title>
    <style>
        /* リセット */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #000000;
            color: #ffffff;
            line-height: 1.6;
        }

        /* ヘッダー */
        .header {
            background-color: #000000;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo-title {
            font-size: 2.5rem;
            font-weight: bold;
            color: #a855f7;
            text-transform: uppercase;
        }

        .navigation ul {
            display: flex;
            list-style: none;
            gap: 2rem;
            margin: 0;
            padding: 0;
        }

        .navigation a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .navigation a:hover {
            color: #a855f7;
        }

        /* メインコンテンツ */
        .main-content {
            width: 100%;
            padding: 0.5rem;
        }

        /* グリッドコンテナ */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(4, 200px);
            gap: 8px;
            width: 100%;
            grid-template-areas: 
                "item1 item1 item2 item2 item3 item3"
                "item4 item4 item5 item6 item3 item3"
                "item7 item8 item8 item9 item10 item10"
                "item11 item12 item12 item13 item13 item13";
        }

        /* グリッドアイテム */
        .grid-item {
            position: relative;
            transition: transform 0.3s ease;
        }

        .grid-item:hover {
            transform: scale(1.02);
            z-index: 10;
        }

        /* 各アイテムの配置 */
        .item-1 { grid-area: item1; }
        .item-2 { grid-area: item2; }
        .item-3 { grid-area: item3; }
        .item-4 { grid-area: item4; }
        .item-5 { grid-area: item5; }
        .item-6 { grid-area: item6; }
        .item-7 { grid-area: item7; }
        .item-8 { grid-area: item8; }
        .item-9 { grid-area: item9; }
        .item-10 { grid-area: item10; }
        .item-11 { grid-area: item11; }
        .item-12 { grid-area: item12; }
        .item-13 { grid-area: item13; }

        /* コミックパネル */
        .comic-panel {
            background-color: #ffffff;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            width: 100%;
            height: 100%;
            transition: all 0.3s ease;
        }

        .comic-panel:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        /* 画像 - 最もシンプルな設定 */
        .comic-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* レスポンシブ */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 150px;
                gap: 4px;
                grid-template-areas: none;
            }
            
            .item-1, .item-2, .item-3, .item-4, .item-5, .item-6, 
            .item-7, .item-8, .item-9, .item-10, .item-11, .item-12, .item-13 {
                grid-area: auto;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-title">PLOTTRON</div>
        </div>
        <nav class="navigation">
            <ul>
                <li><a href="#home">HOME</a></li>
                <li><a href="#creators">CREATORS</a></li>
                <li><a href="#about">ABOUT</a></li>
                <li><a href="#contact">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <div class="grid-container">
            <div class="grid-item item-1">
                <div class="comic-panel">
                    <img src="images/main01.png" alt="Comic 1" class="comic-image">
                </div>
            </div>

            <div class="grid-item item-2">
                <div class="comic-panel">
                    <img src="images/main02.png" alt="Comic 2" class="comic-image">
                </div>
            </div>

            <div class="grid-item item-3">
                <div class="comic-panel">
                    <img src="images/main03.png" alt="Comic 3" class="comic-image">
                </div>
            </div>

            <div class="grid-item item-4">
                <div class="comic-panel">
                    <img src="images/main04.png" alt="Comic 4" class="comic-image">
                </div>
            </div>

            <div class="grid-item item-5">
                <div class="comic-panel">
                    <img src="images/main05.png" alt="Comic 5" class="comic-image">
                </div>
            </div>

            <div class="grid-item item-6">
                <div class="comic-panel">
                    <img src="images/main06.png" alt="Comic 6" class="comic-image">
                </div>
            </div>

            <div class="grid-item item-7">
                <div class="comic-panel">
                    <img src="images/main07.jpg" alt="Comic 7" class="comic-image">
                </div>
            </div>

            <div class="grid-item item-8">
                <div class="comic-panel">
                    <img src="images/main08.png" alt="Comic 8" class="comic-image">
                </div>
            </div>

            <div class="grid-item item-9">
                <div class="comic-panel">
                    <img src="images/main09.png" alt="Comic 9" class="comic-image">
                </div>
            </div>

            <div class="grid-item item-10">
                <div class="comic-panel">
                    <img src="images/main10.jpg" alt="Comic 10" class="comic-image">
                </div>
            </div>

            <div class="grid-item item-11">
                <div class="comic-panel">
                    <img src="images/main11.jpg" alt="Comic 11" class="comic-image">
                </div>
            </div>

            <div class="grid-item item-12">
                <div class="comic-panel">
                    <img src="images/main12.jpg" alt="Comic 12" class="comic-image">
                </div>
            </div>

            <div class="grid-item item-13">
                <div class="comic-panel">
                    <img src="images/main13.jpg" alt="Comic 13" class="comic-image">
                </div>
            </div>
        </div>
    </main>
</body>
</html>
