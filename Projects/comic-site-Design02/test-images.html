<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }
        
        .test-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 800px;
        }
        
        .test-item {
            background: white;
            border: 3px solid red;
            height: 200px;
            position: relative;
        }
        
        .test-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .image-label {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 2px 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>画像表示テスト</h1>
    
    <!-- 直接的な画像テスト -->
    <h2>1. 直接画像</h2>
    <img src="images/main01.png" style="width: 200px; height: auto; border: 2px solid yellow;">
    
    <!-- グリッドテスト -->
    <h2>2. グリッド内の画像</h2>
    <div class="test-container">
        <div class="test-item">
            <div class="image-label">main01.png</div>
            <img src="images/main01.png" alt="Image 1" class="test-image">
        </div>
        <div class="test-item">
            <div class="image-label">main02.png</div>
            <img src="images/main02.png" alt="Image 2" class="test-image">
        </div>
        <div class="test-item">
            <div class="image-label">main03.png</div>
            <img src="images/main03.png" alt="Image 3" class="test-image">
        </div>
        <div class="test-item">
            <div class="image-label">main04.png</div>
            <img src="images/main04.png" alt="Image 4" class="test-image">
        </div>
        <div class="test-item">
            <div class="image-label">main05.png</div>
            <img src="images/main05.png" alt="Image 5" class="test-image">
        </div>
        <div class="test-item">
            <div class="image-label">main06.png</div>
            <img src="images/main06.png" alt="Image 6" class="test-image">
        </div>
    </div>
    
    <!-- 元のHTML構造テスト -->
    <h2>3. 元の構造テスト</h2>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 600px;">
        <div style="background: white; height: 200px;">
            <div style="background: white; width: 100%; height: 100%;">
                <img src="images/main01.png" style="width: 100%; height: 100%; object-fit: cover; display: block;">
            </div>
        </div>
        <div style="background: white; height: 200px;">
            <div style="background: white; width: 100%; height: 100%;">
                <img src="images/main02.png" style="width: 100%; height: 100%; object-fit: cover; display: block;">
            </div>
        </div>
        <div style="background: white; height: 200px;">
            <div style="background: white; width: 100%; height: 100%;">
                <img src="images/main03.png" style="width: 100%; height: 100%; object-fit: cover; display: block;">
            </div>
        </div>
    </div>
</body>
</html>
