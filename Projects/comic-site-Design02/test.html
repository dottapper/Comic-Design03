<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Test</title>
    <style>
        .test-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin: 20px;
        }
        .test-item {
            background: white;
            border: 1px solid #ccc;
            height: 250px;
            overflow: hidden;
        }
        .test-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="test-grid">
        <div class="test-item">
            <img src="images/main01.png" alt="Test 1" class="test-image">
        </div>
        <div class="test-item">
            <img src="images/main02.png" alt="Test 2" class="test-image">
        </div>
        <div class="test-item">
            <img src="images/main03.png" alt="Test 3" class="test-image">
        </div>
        <div class="test-item">
            <img src="images/main04.png" alt="Test 4" class="test-image">
        </div>
    </div>
</body>
</html>
